<title>Garáž & Asfalt 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Plnoobrazovka: 3D scéna, HUD vlevo nahoře, ovládací tlačítka vpravo nahoře, výsuvné menu vlevo (na mobilu dole). */
:root{
  --bg:#101318; --bg2:#171b22; --panel:rgba(20,24,31,.92); --line:#2a313c;
  --fg:#e9e6dc; --dim:#9aa3b0; --accent:#ffb020; --accent-ink:#1a1204; --warn:#ff7a45; --cool:#6cc4ff;
  --f-display:'Rajdhani','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;margin-right:4px;color:var(--accent);background:var(--bg);display:inline-block;min-width:18px;text-align:center}
.ui{position:fixed;z-index:3;pointer-events:none}
.ui>*{pointer-events:auto}

/* HUD */
#hud{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(330px,calc(100vw - 24px));background:rgba(12,15,20,.62);border:1px solid var(--line);padding:8px 10px;pointer-events:none}
#hud .car{font:700 17px var(--f-display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .loc{font:500 11px var(--f-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.spd{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.spd b{font:700 46px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
.spd span{font:500 12px var(--f-mono);color:var(--dim)}
.spd .g{margin-left:auto;font:700 28px var(--f-display);color:var(--fg)}
.rpm{height:5px;background:var(--bg2);margin:4px 0 6px}.rpm i{display:block;height:100%;width:0;background:var(--accent)}
.hs{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font:500 11.5px var(--f-mono);color:var(--dim)}
.hs span:nth-child(odd){text-transform:uppercase;letter-spacing:.06em}.hs span:nth-child(even){color:var(--fg)}
body[data-open="1"] #hud .hs{display:none}

/* horní tlačítka */
#bar{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.tb{background:rgba(12,15,20,.72);border:1px solid var(--line);padding:8px 12px;min-height:38px;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tb:hover{border-color:var(--accent)}

/* menu */
#drawer{left:0;top:0;bottom:0;width:min(400px,100vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);backdrop-filter:blur(6px)}
#drawer.open{transform:none}
#dhead{display:flex;gap:4px;padding:10px 12px 8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.dtab{background:transparent;border:1px solid var(--line);padding:6px 12px;font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;min-height:36px}
.dtab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#dbody{flex:1;overflow:auto;padding:4px 14px 24px;touch-action:pan-y;-webkit-user-select:none;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.note{color:var(--dim);font-size:13px;max-width:60ch}
.lbl{font:600 11px var(--f-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--bg2);border:1px solid var(--line);padding:8px 12px;min-height:38px;text-align:left}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cars,.worlds{display:grid;grid-template-columns:1fr 1fr;gap:6px}.worlds{grid-template-columns:1fr}
.car{background:var(--bg2);border:1px solid var(--line);padding:8px 10px;text-align:left;display:block;width:100%}
.car:hover,.car[aria-pressed=true]{border-color:var(--accent)}
.car b{display:block;font:700 15px var(--f-display);letter-spacing:.02em}.car span{font:500 11.5px var(--f-mono);color:var(--dim)}
.sw{width:30px;height:30px;border:2px solid var(--line);padding:0}.sw[aria-pressed=true]{border-color:var(--accent)}
.seg{display:flex}.seg button{background:transparent;border:1px solid var(--line);padding:7px 12px;font:600 13px var(--f-display);letter-spacing:.05em;text-transform:uppercase;min-height:36px}.seg button+button{border-left:0}
.seg button[aria-pressed=true]{background:var(--cool);border-color:var(--cool);color:#06202e}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0 12px}.stats div{background:var(--bg2);border:1px solid var(--line);padding:5px 8px}
.stats b{display:block;font:600 16px var(--f-display)}.stats span{font:600 10px var(--f-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
fieldset{border:1px solid var(--line);margin:0 0 10px;padding:6px 10px 10px;min-width:0}
legend{font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0 6px}
.ctl{display:grid;grid-template-columns:104px minmax(0,1fr) 62px;gap:8px;align-items:center;margin-top:7px}.ctl.sel{grid-template-columns:104px minmax(0,1fr)}
.ctl label{font-size:12.5px;color:var(--dim)}.ctl output{font:600 11.5px var(--f-mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);touch-action:pan-y}
select{background:var(--bg2);border:1px solid var(--line);padding:6px 6px;width:100%;min-width:0}
.chips .btn{padding:5px 10px;min-height:32px}

/* dotykové ovládání */
#touch{left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
#touch[hidden]{display:none}
.pad{display:flex;gap:10px;pointer-events:auto}
.tbtn{width:86px;height:86px;border-radius:50%;background:rgba(14,17,23,.62);border:2px solid rgba(255,255,255,.28);font:700 16px var(--f-display);letter-spacing:.05em;text-transform:uppercase;touch-action:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column}
.tbtn.big{width:112px;height:112px;background:rgba(255,176,32,.55);border-color:var(--accent);font-size:20px;color:#fff}
.tbtn.brk{border-color:var(--warn);color:var(--warn)}
.tbtn.down{background:rgba(255,255,255,.32)}
.col{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.tbtn.sm{width:62px;height:62px;font-size:12px}
#keyhint{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:500 11.5px var(--f-mono);color:var(--dim);background:rgba(12,15,20,.55);padding:5px 10px;border:1px solid var(--line);white-space:nowrap;pointer-events:none;max-width:96vw;overflow:hidden}
#keyhint[hidden]{display:none}

#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(12,15,20,.85);border:1px solid var(--accent);padding:8px 16px;font:700 18px var(--f-display);letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#err,#nogl{position:fixed;left:12px;right:12px;bottom:12px;background:#3a1210;border:1px solid var(--warn);color:#ffd9cf;padding:10px 12px;z-index:20;font:500 12px var(--f-mono);user-select:text}
#loading{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;font:700 22px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}


/* multiplayer */
#mpChip{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));font:700 12px var(--f-mono);letter-spacing:.06em;background:rgba(12,15,20,.62);border:1px solid var(--line);padding:5px 9px;color:#7dffa6;pointer-events:none}
#mpChip[hidden]{display:none}
#race{top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(300px,calc(100vw - 24px));background:rgba(12,15,20,.7);border:1px solid var(--accent);padding:7px 10px;pointer-events:none;text-align:center}
#race button{pointer-events:auto}
body[data-racing="1"] #bar,body[data-racing="1"] #keyhint{display:none}
#race[hidden],#raceBig[hidden],#raceRes[hidden]{display:none}
#race .rl{font:600 11px var(--f-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#race .rr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
#race .rr b{font:700 24px var(--f-display)}
#rArrow{display:inline-block;font-size:26px;color:var(--accent);line-height:1;transition:transform .08s linear}
#rList{margin-top:5px;text-align:left;font:600 12px var(--f-mono)}#rList .me{color:var(--accent)}
#raceBig{top:30%;left:50%;transform:translateX(-50%);font:800 96px var(--f-display);color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.7);pointer-events:none;letter-spacing:.06em}
#raceRes{top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 24px));background:rgba(12,15,20,.92);border:1px solid var(--accent);padding:14px}
#raceRes h3{margin:0 0 8px;font:800 22px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#raceRes .row2{display:flex;justify-content:space-between;font:600 14px var(--f-mono);padding:3px 0;border-bottom:1px solid var(--line)}
.mpl{font:600 13px var(--f-mono);color:var(--dim);margin:4px 0}.mpl b{color:var(--ink,#eee)}
.mpin{background:var(--bg2);border:1px solid var(--line);padding:7px 9px;min-height:38px;width:100%;color:inherit}
@media(max-width:720px){#raceBig{font-size:72px}#race{top:calc(96px + env(safe-area-inset-top,0px))}}
@media(max-width:720px){
  #drawer{top:auto;width:100%;height:56vh;border-right:0;border-top:1px solid var(--line);transform:translateY(102%);padding-top:0}
  #drawer.open{transform:none}
  #dhead{margin-top:0}
  #hud{width:min(260px,calc(100vw - 150px))}
  #hud .spd b{font-size:36px}
  .cars{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){#drawer,#toast{transition:none}}
</style>

<canvas id="gl"></canvas>
<div id="loading">Načítám…</div>
<div id="nogl" hidden>Tvůj prohlížeč nepodporuje WebGL, takže 3D hra nejde spustit. Zkus jiný prohlížeč nebo zapni hardwarovou akceleraci.</div>
<div id="err" hidden></div>
<div id="toast"></div>

<div class="ui" id="hud">
  <div class="car" id="hCar">Auto</div>
  <div class="loc" id="hLoc">Garáž</div>
  <div class="spd"><b id="hSpeed">0</b><span>km/h</span><span class="g" id="hGear">N</span></div>

</div>
<div class="ui" id="bar">
  <button class="tb" id="bCam">Kamera</button>
  <button class="tb" id="bReset">Postavit</button>
  <button class="tb" id="bSnd">Zvuk</button>
  <button class="tb" id="bMenu">Menu</button>
</div>
<div class="ui" id="drawer">
  <div id="dhead">
    <button class="dtab" data-tab="cars">Auta</button><button class="dtab" data-tab="garage">Garáž</button><button class="dtab" data-tab="world">Svět</button><button class="dtab" data-tab="online">Online</button><button class="dtab" data-tab="settings">Nastavení</button>
  </div>
  <div id="dbody"></div>
</div>
<div class="ui" id="mpChip" hidden></div>
<div class="ui" id="race" hidden>
  <div class="rl" id="rInfo">Kolo 1/1</div>
  <div class="rr"><span><span class="rl">Pozice</span><br><b id="rPos">1/1</b></span><span id="rArrow">▲</span><span><span class="rl">Čas</span><br><b id="rTime">0:00.00</b></span><span><span class="rl">Brána</span><br><b id="rDist">0 m</b></span></div>
  <div id="rList"></div>
  <button class="tb" data-mp="leave" style="margin-top:6px">Opustit závod</button>
</div>
<div class="ui" id="raceBig" hidden></div>
<div class="ui" id="raceRes" hidden></div>
<div class="ui" id="touch" hidden>
  <div class="pad"><button class="tbtn" data-t="left" aria-label="Doleva">◀</button><button class="tbtn" data-t="right" aria-label="Doprava">▶</button></div>
  <div class="col">
    <button class="tbtn sm" data-t="hand">Ruční</button>
    <div class="pad"><button class="tbtn brk" data-t="brake">Brzda</button><button class="tbtn big" data-t="gas">Plyn</button></div>
  </div>
</div>
<div class="ui" id="keyhint" hidden><kbd>W</kbd><kbd>S</kbd> plyn/brzda <kbd>A</kbd><kbd>D</kbd> zatáčení <kbd>Mezerník</kbd> ruční <kbd>C</kbd> kamera <kbd>R</kbd> postavit <kbd>M</kbd> menu</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* ===== Data aut, tuning a odvozené hodnoty (bez závislosti na THREE) ===== */
var G = 9.81;
var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };

/* tvarové předvolby karoserie (metry) */
var SHAPES = {

var CARS = [
  { id: 'gtr',  n: 'Nissan Skyline GT-R (R34)', hp: 330, m: 1560, d: 'AWD', cl: 130, cdA: .70, top: 300, shape: 'gtr',   color: 0x1e3c8c, rim: 17, w: 235, p: 45, red: 8000, snd: 'i6' },
  { id: 'supra',n: 'Toyota Supra (A80)',        hp: 320, m: 1510, d: 'RWD', cl: 120, cdA: .66, top: 290, shape: 'supra',   color: 0xd8d8d8, rim: 17, w: 255, p: 40, red: 7200, snd: 'i6' },
  { id: 'mx5',  n: 'Mazda MX-5 (NA)',           hp: 130, m:  960, d: 'RWD', cl: 130, cdA: .62, top: 200, shape: 'mx5',color: 0xb4121b, rim: 15, w: 195, p: 55, red: 7000, snd: 'i4' },
  { id: 'civic',n: 'Honda Civic Type R',        hp: 320, m: 1400, d: 'FWD', cl: 125, cdA: .68, top: 270, shape: 'civic',   color: 0xf0f0f0, rim: 19, w: 235, p: 35, red: 7300, snd: 'i4' },
  { id: 'golf', n: 'VW Golf GTI',               hp: 245, m: 1330, d: 'FWD', cl: 130, cdA: .66, top: 250, shape: 'golf',   color: 0x7a1020, rim: 18, w: 225, p: 40, red: 6800, snd: 'i4' },

  { id: 'gt3',  n: 'Porsche 911 GT3',           hp: 510, m: 1435, d: 'RWD', cl: 115, cdA: .66, top: 320, shape: 'gt3',   color: 0xff6a00, rim: 20, w: 305, p: 30, red: 9000, snd: 'flat6' },
  { id: 'huracan', n: 'Lamborghini Huracán',    hp: 610, m: 1422, d: 'AWD', cl: 110, cdA: .65, top: 325, shape: 'huracan',color: 0x76c900, rim: 20, w: 305, p: 30, red: 8500, snd: 'v10' },
  { id: 'lc',   n: 'Toyota Land Cruiser',       hp: 285, m: 2450, d: 'AWD', cl: 225, cdA: 1.05,top: 185, shape: 'lc',     color: 0x23262b, rim: 18, w: 265, p: 60, red: 5800, snd: 'v6' },

];

var STYLES = { five: 'Pětiramenný', multi: 'Multi-spoke', mesh: 'Síťka (mesh)', dish: 'Deep dish', turbo: 'Turbofan', bead: 'Terénní beadlock', steel: 'Ocelový (steelie)' };
var ENGINE = ['Seriový motor', 'Stage 1 (ECU + sání)', 'Stage 2 (vačky + výfuk)', 'Stage 3 (kované vnitřnosti)', 'Stage 4 (závodní motor)'];
var BOOST = { none: ['Bez přeplňování', 1], turbo: ['Turbo', 1.22], comp: ['Kompresor', 1.17], twin: ['Twin-turbo', 1.36] };
var GEARS = { short: ['Krátká převodovka (zrychlení)', .86], stock: ['Seriová převodovka', 1], long: ['Dlouhá převodovka (vrchol)', 1.16] };
var BRAKES = ['Seriové brzdy', 'Sportovní brzdy', 'Keramické brzdy', 'Závodní brzdy'];
var BRK = [.92, 1.0, 1.1, 1.2];
var PAINTS = [['Původní', null], ['Červená', 0xc0121b], ['Modrá', 0x1e3c8c], ['Bílá', 0xe9e9e9], ['Černá', 0x0d0d10], ['Oranžová', 0xff6a00], ['Zelená', 0x2f8f3a], ['Žlutá', 0xe8b100], ['Stříbrná', 0x9aa0a8]];

function defaultsFor(c) {
  return { stage: 0, boost: 'none', gear: 'stock', brk: 1, drive: c.d, h: c.cl, camber: 0, damp: 5,
    style: c.cl > 200 ? 'bead' : 'five', rim: c.rim, w: c.w, p: c.p, tire: c.cl > 200 ? 'off' : 'road', paint: null };
}

function powerTop(hp, cdA, m) {
  var P = hp * 745.7 * .85;
  for (var v = 20; v < 130; v += .25) { var F = .5 * 1.2 * cdA * v * v + .015 * m * G; if (F * v > P) return v * 3.6; }
  return 460;
}
function derived(c, t) {
  var hp = c.hp * (1 + .10 * t.stage) * BOOST[t.boost][1];
  var m = c.m + t.stage * 8 + (t.boost === 'none' ? 0 : t.boost === 'twin' ? 28 : 16) + (t.rim - c.rim) * 3.2 * 4 + (t.w - c.w) * .05 * 4 + (t.brk >= 2 ? -8 : 0);
  var vPow = powerTop(hp, c.cdA, m);
  var gearTop = c.top * GEARS[t.gear][1] * (1 + (t.rim - c.rim) * .012);

  function stripeTex() {

  function buildGuide(def, w) {

        var bd = new T.Mesh(new T.PlaneGeometry(3.2, 2.4), bmat); bd.position.set(px, 2.3, pz); bd.rotation.y = yaw; if (!rightTurn) bd.scale.x = -1; g.add(bd);
      });
      for (var o2 = -7.2; o2 <= 7.3; o2 += 2.4) {
        var qx = c.x + d1[0] * 10.5 + rgt[0] * o2, qz = c.z + d1[1] * 10.5 + rgt[1] * o2;
        var bl = new T.Mesh(new T.BoxGeometry(2.3, .9, .6), smat); bl.position.set(qx, .45, qz); bl.rotation.y = yaw; g.add(bl); obst.push({ x: qx, z: qz, r: 1.25 });

    });
    /* oblouky START / CÍL */
    R.arches.forEach(function (ar) {
      var ex = Math.cos(ar.yaw), ez = -Math.sin(ar.yaw), pm = new T.MeshStandardMaterial({ color: 0xd9dde3, roughness: .5, metalness: .4 });

      var bm = new T.Mesh(new T.BoxGeometry(ar.hw * 2 + .7, .5, .7), pm); bm.position.set(ar.x, ar.y + 7, ar.z); bm.rotation.y = ar.yaw; g.add(bm);

      ban.position.set(ar.x, ar.y + 5.7, ar.z); ban.rotation.y = ar.yaw + Math.PI / 2; g.add(ban);

  }

  /* ---------- závody ---------- */
  var beamA, beamB, gateGroup;
  function ensureBeams() {
    if (gateGroup || !G.scene) return;
    gateGroup = new T.Group();
    function mk(c, o) { var m = new T.Mesh(new T.CylinderGeometry(2.6, 2.6, 70, 16, 1, true), new T.MeshBasicMaterial({ color: c, transparent: true, opacity: o, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide, fog: false })); gateGroup.add(m); return m; }
    beamA = mk(0xffb020, .55); beamB = mk(0x4fd0ff, .22); G.scene.add(gateGroup); gateGroup.visible = false;
  }
  MP.createRace = function (k) {
    if (!MP.nr || !RACES[k] || RACES[k].world !== G.worldId) return;
    var id = Math.random().toString(36).slice(2, 8);
    MP.myOffer = { id: id, k: k }; MP.my = { id: id, s: 'l', g: 0 }; MP.t = 1; pushPresence(); changed();
  };
  MP.cancelOffer = function () { MP.myOffer = null; MP.my = null; MP.t = 1; pushPresence(); changed(); };
  MP.joinRace = function (o) { MP.my = { id: o.id, s: 'l', g: 0 }; MP.t = 1; pushPresence(); changed(); };
  MP.leaveRace = function () { if (MP.myOffer) MP.myOffer = null; endRace(true); MP.t = 1; pushPresence(); changed(); };
  MP.startRace = function () {
    if (!MP.myOffer || !MP.my) return;
    var o = MP.lobby.filter(function (l) { return l.id === MP.myOffer.id && l.s === 'l'; }).map(function (l) { return l.peer; });
    var me = myPeerId(); if (me) o.unshift(me);
    o = o.slice(0, RACES[MP.myOffer.k].maxP);
    MP.myOffer = { id: MP.myOffer.id, k: MP.myOffer.k, st: 1, o: o }; MP.t = 1; pushPresence(); changed();
  };
  function raceTick(dt) {
    var me = myPeerId(), rc = MP.race;
    if (MP.my && !rc) {
      var off = null; for (var i = 0; i < MP.offers.length; i++) if (MP.offers[i].id === MP.my.id) off = MP.offers[i];
      if (MP.myOffer && MP.myOffer.id === MP.my.id) off = MP.myOffer;
      if (!off) { MP.my = null; changed(); }
      else if (off.st) {
        var slot = me ? off.o.indexOf(me) : -1;
        if (slot >= 0) beginRace(off.k, off.id, slot, off.o.length); else { MP.my = null; changed(); }
      }
    }
    rc = MP.race; if (!rc) { if (gateGroup) gateGroup.visible = false; updateRaceHud(); return; }
    var V = G.V;
    if (rc.phase === 'count') {
      rc.cd -= dt; G.lock = true;
      if (rc.cd <= 0) { rc.phase = 'run'; rc.t0 = performance.now(); G.lock = false; MP.my.s = 'r'; showBig('START!', 900); }
    } else if (rc.phase === 'run' || rc.phase === 'fin') {
      if (rc.phase === 'run') {
        var g = rc.gates[rc.idx % rc.gates.length], dx = V.x - g.x, dz = V.z - g.z;
        if (dx * dx + dz * dz < g.r * g.r && Math.abs(V.y - (g.y + V.r + V.sRef)) < 5) {
          rc.idx++; MP.my.g = rc.idx;
          if (g.fin || rc.idx % rc.gates.length === 0) { rc.lap++; if (rc.lap >= rc.laps) { rc.phase = 'fin'; rc.ft = performance.now() - rc.t0; MP.my.s = 'f'; MP.my.ft = rc.ft; rc.finAt = performance.now(); showBig('CÍL!', 1500); } else showBig('Kolo ' + (rc.lap + 1) + '/' + rc.laps, 1100); }
          MP.t = 1;
        }
      }
      var fin = standings(); var all = fin.every(function (x) { return x.ft != null; });

    }
    /* značky bran */
    ensureBeams();
    if (gateGroup) {
      if (rc.phase === 'run') {
        var gA = rc.gates[rc.idx % rc.gates.length], gB = rc.gates[(rc.idx + 1) % rc.gates.length];
        gateGroup.visible = true; beamA.position.set(gA.x, gA.y + 35, gA.z); beamA.scale.set(gA.r / 8, 1, gA.r / 8); beamA.material.color.setHex(gA.fin ? 0x40ff80 : 0xffb020);
        if (rc.idx + 1 < rc.gates.length * rc.laps) { beamB.visible = true; beamB.position.set(gB.x, gB.y + 35, gB.z); beamB.scale.set(gB.r / 8, 1, gB.r / 8); } else beamB.visible = false;

  };

</script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    try { if (Game.init()) { initUI(); if (Game.MP) Game.MP.autoStart(); } } catch (e) { var b = document.getElementById('err'); b.hidden = false; b.textContent = 'Chyba při startu: ' + e.message + (e.stack ? ' | ' + e.stack.split('\n')[1] : ''); }
